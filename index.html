<!DOCTYPE html>
<html>
  <head>
    <title>Filter Status</title>
    <script src="tableau.extensions.1.latest.js"></script>
    <script src="main.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; font-size: 12px; color: #333; }
      #content { width: 100%; height: 100%; position: fixed; overflow: auto; box-sizing: border-box; padding: 8px; }
      .banner { padding: 6px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 8px; }
      .banner.on { background: #fdecc8; color: #7a4d00; }
      .banner.off { background: #e3f1e3; color: #226622; }
      .row { padding: 5px 0; border-bottom: 1px solid #eee; }
      .top { display: flex; align-items: center; gap: 6px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .dot.on { background: #e08a00; }
      .dot.off { background: #aaa; }
      .name { flex: 1; font-weight: bold; }
      .state { color: #666; }
      .detail { margin-left: 16px; color: #666; }
    </style>
  </head>
  <body>
    <div id="content"></div>
  </body>
</html>
